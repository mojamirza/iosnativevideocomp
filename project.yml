name: VidCompress
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  VidCompress:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets.xcassets
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: VidCompress
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: ""
        NSPhotoLibraryUsageDescription: Pick videos from your library to compress.
        NSPhotoLibraryAddUsageDescription: Save compressed videos back to your photo library.
        ITSAppUsesNonExemptEncryption: false
        # Background compression (BGContinuedProcessingTask, iOS 26+)
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.vidcompress.compress
        UIBackgroundModes:
          - processing
        # Expose the app's folder in Files → "On My iPad" → VidCompress,
        # so compressed videos can be transferred out easily.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: VidCompress
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vidcompress
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "2"          # iPad-focused
        DEVELOPMENT_TEAM: ""                  # set locally in Xcode, or via CI secrets
        CODE_SIGN_STYLE: Automatic
schemes:
  VidCompress:
    build:
      targets:
        VidCompress: all
    archive:
      config: Release
