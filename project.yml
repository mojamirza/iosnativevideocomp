name: VidCompress
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  VidCompress:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Asset catalogs belong under `sources` in XcodeGen (assigned to the
      # resources phase automatically). A `resources:` key is silently
      # ignored — it cost us the app icon in every previous build.
      - path: Assets.xcassets
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: VidCompress
        # Version keys resolve from the TARGET BUILD SETTINGS at build time
        # (literal defaults here would override MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION — CI proved the bundle shipped 1.0(1)
        # despite the settings saying otherwise).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # MULTITASKING: Split View / Stage Manager supported (also the
        # prerequisite for drag-and-drop import from Files). Multitasking
        # iPad apps must support ALL FOUR orientations per App Store rules.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # PhotosPicker runs out-of-process (no library-read permission
        # needed) and saving uses add-only authorization, so only the
        # add-only usage key is required.
        NSPhotoLibraryAddUsageDescription: Save compressed videos back to your photo library.
        ITSAppUsesNonExemptEncryption: false
        # Background compression (BGContinuedProcessingTask, iOS 26+)
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.vidcompress.compress
        UIBackgroundModes:
          - processing
        # Expose the app's folder in Files → "On My iPad" → VidCompress,
        # so compressed videos can be transferred out easily.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: VidCompress
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vidcompress
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.3.1"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "2"          # iPad-focused
        DEVELOPMENT_TEAM: ""                  # set locally in Xcode, or via CI secrets
        CODE_SIGN_STYLE: Automatic

  # CI unit-test target. TEST_HOST = the app (UIKit/AVFoundation plumbing
  # needs a host process in the simulator); the Info plist is generated.
  VidCompressTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VidCompress
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vidcompress.tests
        SWIFT_VERSION: "5.10"
schemes:
  VidCompress:
    build:
      targets:
        VidCompress: all
        VidCompressTests: [test]
    test:
      config: Debug
      targets:
        - VidCompressTests
    archive:
      config: Release
