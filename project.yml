name: VidCompress
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  VidCompress:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: VidCompress
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vidcompress
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "2"          # iPad-focused
        DEVELOPMENT_TEAM: ""                  # set locally in Xcode, or via CI secrets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: ""
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick videos from your library to compress."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  VidCompress:
    build:
      targets:
        VidCompress: all
    archive:
      config: Release
